groups:
  - name: gamepanel.rules
    rules:
      - alert: GamePanelAPIDown
        expr: up{job="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Forge API is down"
          description: "Prometheus cannot scrape the Forge API."

      - alert: GamePanelDaemonDown
        expr: up{job="daemon"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Beacon daemon is down"
          description: "Prometheus cannot scrape the beacon daemon."

      - alert: PrometheusSelfScrapeFailed
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus self-scrape failed"
          description: "Prometheus is unable to scrape its own metrics endpoint."
