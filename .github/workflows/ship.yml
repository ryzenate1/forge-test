name: Ship Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/gamepanel/forge-api
  WEB_IMAGE: ghcr.io/gamepanel/forge-web
  BEACON_IMAGE: ghcr.io/gamepanel/beacon

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: forge/api/go.mod
          cache-dependency-path: forge/api/go.sum

      - name: Vet forge/api
        working-directory: forge/api
        run: go vet ./...

      - name: Vet beacon
        working-directory: beacon
        run: go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm --workspace @forge/web run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: forge/api/go.mod
          cache-dependency-path: forge/api/go.sum

      - name: Test beacon
        working-directory: beacon
        run: go test -race -timeout 5m ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test web
        run: npm --workspace @forge/web test

  docker-build:
    name: Docker Build & Smoke Test
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: forge/api/Dockerfile
          load: true
          tags: ${{ env.API_IMAGE }}:latest

      - name: Build local Beacon image
        uses: docker/build-push-action@v6
        with:
          context: beacon
          file: beacon/Dockerfile
          load: true
          tags: ${{ env.BEACON_IMAGE }}:latest

      - name: Build local Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: forge/web/Dockerfile
          load: true
          tags: ${{ env.WEB_IMAGE }}:latest

      - name: Run Smoke Stack
        env:
          API_SMOKE_IMAGE: ${{ env.API_IMAGE }}:latest
          WEB_SMOKE_IMAGE: ${{ env.WEB_IMAGE }}:latest
          DAEMON_SMOKE_IMAGE: ${{ env.BEACON_IMAGE }}:latest
          POSTGRES_PASSWORD: smoke_test_password_12345
          API_AUTH_SECRET: smoke_test_api_secret_at_least_32_chars_long
          APP_KEY: smoke_test_app_key_at_least_32_chars_long
          DATABASE_URL: postgres://gamepanel:smoke_test_password_12345@postgres:5432/gamepanel?sslmode=disable
          FORGE_MASTER_KEY: c21va2VfdGVzdF9tYXN0ZXJfa2V5XzMyX2NoYXJzX2xvbmch
          DAEMON_NODE_TOKEN: 0123456789abcdef.0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DAEMON_NODE_ID: 00000000-0000-0000-0000-000000000001
          DAEMON_SFTP_HOST_KEY_PASSPHRASE: smoke_sftp_key_passphrase_32_chars!
          METRICS_TOKEN: smoke_metrics_token_32_characters_long!
          PANEL_DOMAIN: localhost
          PANEL_URL: http://localhost:3000
          TAG: latest
        run: |
          docker compose -f infra/compose.yml -f infra/compose.smoke.yml up -d postgres redis api web daemon
          sleep 10
          docker compose -f infra/compose.yml -f infra/compose.smoke.yml ps

      - name: Verify Health Endpoints
        run: |
          for i in {1..30}; do
            api_ok=$(curl -sf http://127.0.0.1:8080/health || echo "fail")
            web_ok=$(curl -sf http://127.0.0.1:3000/ > /dev/null && echo "ok" || echo "fail")
            daemon_ok=$(curl -sf http://127.0.0.1:9090/health || echo "fail")
            if [ "$api_ok" != "fail" ] && [ "$web_ok" = "ok" ] && [ "$daemon_ok" != "fail" ]; then
              echo "Smoke tests passed!"
              exit 0
            fi
            echo "Waiting for services... (attempt $i/30)"
            sleep 2
          done
          echo "Smoke test timed out"
          docker compose -f infra/compose.yml -f infra/compose.smoke.yml logs
          exit 1

      - name: Teardown Smoke Stack
        if: always()
        run: |
          docker compose -f infra/compose.yml -f infra/compose.smoke.yml down -v --remove-orphans || true
